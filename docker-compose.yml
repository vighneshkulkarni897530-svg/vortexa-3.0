version: "3.8"

services:
  # ============================================================================
  # 1. PostgreSQL Database Service (Persistent Data Store)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: promptshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promptshield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promptshield_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-promptshield_db}
    volumes:
      - promptshield_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promptshield_user} -d ${POSTGRES_DB:-promptshield_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - promptshield-net

  # ============================================================================
  # 2. Database Migration Runner (Alembic Schema Sync)
  # ============================================================================
  migration:
    build:
      context: .
      dockerfile: Dockerfile.policy
    container_name: promptshield-migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-promptshield_user}:${POSTGRES_PASSWORD:-promptshield_secure_pass}@postgres:5432/${POSTGRES_DB:-promptshield_db}
      FAIL_SECURE_MODE: "true"
    command: ["alembic", "upgrade", "head"]
    networks:
      - promptshield-net

  # ============================================================================
  # 3. Policy & DB Service (Laptop 3 - Port 8001)
  # ============================================================================
  policy-service:
    build:
      context: .
      dockerfile: Dockerfile.policy
    container_name: promptshield-policy-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-promptshield_user}:${POSTGRES_PASSWORD:-promptshield_secure_pass}@postgres:5432/${POSTGRES_DB:-promptshield_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-canary-integration-insecure-default-change-in-prod-7749}
      JWT_ALGORITHM: "HS256"
      FAIL_SECURE_MODE: "true"
      LOG_LEVEL: "INFO"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - promptshield-net

  # ============================================================================
  # 4. Detection Engine Service (Laptop 2 - Port 8000)
  # ============================================================================
  detection-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: promptshield-detection-service
    restart: unless-stopped
    depends_on:
      policy-service:
        condition: service_healthy
    environment:
      POLICY_SERVICE_URL: "http://policy-service:8001"
      POLICY_TIMEOUT_SECONDS: "2.0"
      MOCK_LLM_MODE: "true"
      CANARY_TOKENS: '["CANARY_VORTEXA_SEC_7749","VRTX-TEST-SECRET-XYZ-99","SYNTHETIC-CANARY-TOKEN-42"]'
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - promptshield-net

  # ============================================================================
  # 5. Frontend Dashboard (Laptop 1 - Port 3000 / Port 80)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: promptshield-frontend
    restart: unless-stopped
    depends_on:
      detection-service:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
    networks:
      - promptshield-net

  # ============================================================================
  # 6. Test Runner Service (Optional Validation Profile: --profile test)
  # ============================================================================
  test-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: promptshield-test-runner
    depends_on:
      detection-service:
        condition: service_healthy
      policy-service:
        condition: service_healthy
    environment:
      DATABASE_URL: sqlite:///:memory:
      FAIL_SECURE_MODE: "true"
      MOCK_LLM_MODE: "true"
    command: ["pytest", "-v"]
    networks:
      - promptshield-net

volumes:
  promptshield_pgdata:
    name: promptshield_pgdata

networks:
  promptshield-net:
    name: promptshield-network
    driver: bridge
