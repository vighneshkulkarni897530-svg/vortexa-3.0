events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Security Headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    server {
        listen 80;
        server_name localhost;

        # Serve static single-page dashboard
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Health endpoint
        location /health {
            proxy_pass http://detection-service:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy detection & benchmark requests to detection engine
        location /api/v1/scan {
            proxy_pass http://detection-service:8000/api/v1/scan;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/benchmark/ {
            proxy_pass http://detection-service:8000/api/v1/benchmark/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/llm/ {
            proxy_pass http://detection-service:8000/api/v1/llm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy policy, review queue, and audit requests to policy service
        location /api/v1/policies {
            proxy_pass http://policy-service:8001/api/v1/policies;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/review-queue {
            proxy_pass http://policy-service:8001/api/v1/review-queue;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/audit-events {
            proxy_pass http://policy-service:8001/api/v1/audit-events;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/enforce {
            proxy_pass http://policy-service:8001/api/v1/enforce;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/auth/ {
            proxy_pass http://policy-service:8001/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/stats {
            proxy_pass http://policy-service:8001/api/v1/stats;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/evaluations {
            proxy_pass http://policy-service:8001/api/v1/evaluations;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
